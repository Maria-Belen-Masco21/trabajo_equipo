{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm">
<div class="card-header d-flex justify-content-between">
<h3>Listado de Tareas</h3>
<a href="{{ url_for('bp_tarea.create') }}" class="btn btn-primary">Nueva</a>
</div>
<div class="card-body">
<table class="table table-striped">
<tr><th>ID</th><th>Descripción</th><th>Estado</th><th>Acciones</th></tr>
{% for tarea in tareas %}
<tr>
<td>{{ tarea.id }}</td>
<td>{{ tarea.descripcion }}</td>
<td>
{% if tarea.completado %}
<span class="badge bg-success">Completado</span>
{% else %}
<span class="badge bg-danger">Pendiente</span>
{% endif %}
</td>
<td>
<a href="{{ url_for('bp_tarea.edit', id=tarea.id) }}" class="btn btn-warning btn-sm">Editar</a>
<a href="{{ url_for('bp_tarea.delete', id=tarea.id) }}" class="btn btn-danger btn-sm">Eliminar</a>
</td>
</tr>
{% endfor %}
</table>
</div>
</div>
{% endblock %}
