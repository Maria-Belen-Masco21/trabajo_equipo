{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-header"><h3>Registrar Miembro</h3></div>
        <div class="card-body">
            <form method="POST">
        <div class="mb-3">
            <label>Nombre</label>
            <input type="text" name="nombre" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Email</label>
            <input type="email" name="email" class="form-control" required>
        </div>
        <button class="btn btn-success">Guardar</button>
            </form>
        </div>
</div>
{% endblock %}
